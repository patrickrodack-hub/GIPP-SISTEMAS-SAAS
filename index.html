<html lang="en">

    <meta charset="UTF-8" />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="GIPP" />
    <meta name="application-name" content="GIPP" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/3004/3004613.png" />
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3004/3004613.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="description" content="Sistema de gestão eclesiástica GIPP v13.0.0 com auditoria de aparelhos SaaS em tempo real, telemetria de hardware, louvor com cifras dinâmicas, teologia CGADB/CPAD, loja virtual e Google Workspace." />
    <meta property="og:title" content="Gestão de Igreja - GIPP" />
    <meta property="og:description" content="Sistema de gestão eclesiástica GIPP v13.0.0 com auditoria de aparelhos SaaS em tempo real, telemetria de hardware, louvor com cifras dinâmicas, teologia CGADB/CPAD, loja virtual e Google Workspace." />
    <title>Gestão de Igreja - GIPP</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => {
              console.log('[GIPP PWA] Service Worker registrado com sucesso:', reg.scope);
            })
            .catch(err => {
              console.warn('[GIPP PWA] O registro do SW falhou:', err);
            });
        });
      }
    </script>
  </body>
</html>
