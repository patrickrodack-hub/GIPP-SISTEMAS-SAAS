<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Telão & Projetor GIPP Holyrics</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #020617;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #stage {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: background 0.5s ease;
      padding: 3rem 4rem;
    }
    .theme-navy { background: linear-gradient(135deg, #020617, #0f172a, #1e1b4b); color: #ffffff; }
    .theme-dark { background: #000000; color: #ffffff; }
    .theme-amber { background: linear-gradient(135deg, #451a03, #0f172a, #292524); color: #fef3c7; }
    .theme-clean { background: linear-gradient(135deg, #f8fafc, #ffffff, #f1f5f9); color: #0f172a; }
    .theme-royal { background: linear-gradient(135deg, #312e81, #0f172a, #581c87); color: #ffffff; }

    #header-pill {
      align-self: center;
      padding: 0.5rem 1.5rem;
      border-radius: 9999px;
      font-size: 1.25rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      margin-bottom: 2rem;
      display: none;
    }
    #content-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    #slide-title {
      font-size: 4.5rem;
      font-weight: 900;
      line-height: 1.1;
      margin-bottom: 1.5rem;
      text-shadow: 0 4px 16px rgba(0,0,0,0.8);
    }
    #slide-text {
      font-size: 3.5rem;
      font-weight: 800;
      line-height: 1.4;
      white-space: pre-line;
      max-width: 85vw;
      text-shadow: 0 4px 14px rgba(0,0,0,0.8);
    }
    #verse-ref {
      font-size: 2.25rem;
      font-weight: 800;
      color: #facc15;
      margin-top: 2rem;
      text-shadow: 0 2px 8px rgba(0,0,0,0.8);
      display: none;
    }
    #blackout-overlay {
      position: fixed;
      inset: 0;
      background: #000000;
      z-index: 999;
      display: none;
    }
    #alert-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(90deg, #d97706, #f59e0b, #ea580c);
      color: #000000;
      padding: 1rem 2rem;
      font-size: 1.5rem;
      font-weight: 900;
      display: none;
      z-index: 100;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.5);
    }
    #logo-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(12px);
      z-index: 80;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 3rem;
    }
    #logo-img-wrap {
      width: 14rem;
      height: 14rem;
      border-radius: 2rem;
      background: rgba(15, 23, 42, 0.85);
      border: 3px solid rgba(251, 191, 36, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      margin-bottom: 2rem;
      box-shadow: 0 20px 60px rgba(0,0,0,0.9);
    }
    #logo-img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    #logo-church-name {
      font-size: 4rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      text-shadow: 0 4px 20px rgba(0,0,0,0.9);
      margin-bottom: 0.5rem;
    }
    #logo-church-pastor {
      font-size: 1.75rem;
      font-weight: 700;
      color: #facc15;
      margin-bottom: 0.5rem;
    }
    #logo-church-city {
      font-size: 1.5rem;
      font-weight: 600;
      color: #e2e8f0;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 0.5rem;
    }
    #logo-church-sub {
      font-size: 1.25rem;
      color: #94a3b8;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-top: 1rem;
      border-top: 1px solid rgba(255,255,255,0.15);
      padding-top: 1rem;
    }
    #footer-info {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      opacity: 0.5;
      font-family: monospace;
    }
    #media-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 15;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    #media-overlay img {
      width: 100%;
      height: 100%;
    }
    #bg-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }
    #stage {
      position: relative;
      z-index: 5;
    }
  </style>
</head>
<body class="theme-navy">
  <canvas id="bg-canvas"></canvas>
  <div id="blackout-overlay"></div>
  <div id="media-overlay">
    <img id="media-img" src="" alt="Mídia" />
  </div>
  <div id="logo-overlay">
    <div id="logo-img-wrap">
      <img id="logo-img" src="" alt="Logo" style="display:none;" />
      <div id="logo-fallback" style="font-size:5rem;">🛡️</div>
    </div>
    <div id="logo-church-name">ASSEMBLEIA DE DEUS</div>
    <div id="logo-church-pastor"></div>
    <div id="logo-church-city"></div>
    <div id="logo-church-sub">Comunhão • Palavra • Louvor • Adoração</div>
  </div>
  <div id="stage">
    <div id="header-pill"></div>
    <div id="content-wrap">
      <h1 id="slide-title"></h1>
      <p id="slide-text">Conectando ao GIPP Holyrics...</p>
      <div id="verse-ref"></div>
    </div>
    <div id="footer-info">
      <span id="church-label">ASSEMBLEIA DE DEUS • TELÃO HOLYRICS</span>
      <span id="slide-counter">Slide 1 / 1</span>
    </div>
  </div>
  <div id="alert-bar"></div>

  <script>
    const STORAGE_KEY = 'gipp_holyrics_projection_state';
    const CHANNEL_NAME = 'gipp_holyrics_channel';

    let channel;
    try {
      channel = new BroadcastChannel(CHANNEL_NAME);
      channel.onmessage = (e) => {
        if (e.data && e.data.type === 'STATE_UPDATE') {
          renderState(e.data.payload);
        }
      };
      channel.postMessage({ type: 'PING' });
    } catch(err) {
      console.warn('BroadcastChannel fallback:', err);
    }

    window.addEventListener('storage', (e) => {
      if (e.key === STORAGE_KEY && e.newValue) {
        try {
          renderState(JSON.parse(e.newValue));
        } catch(err) {}
      }
    });

    // Carga inicial do localStorage
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) renderState(JSON.parse(saved));
    } catch(err) {}

    function renderState(state) {
      if (!state) return;

      // Blackout
      const blackoutEl = document.getElementById('blackout-overlay');
      blackoutEl.style.display = state.blackout ? 'block' : 'none';

      // Logo da Igreja com Informações do Banco de Dados
      const logoOverlay = document.getElementById('logo-overlay');
      if (state.exibirLogo && !state.blackout) {
        logoOverlay.style.display = 'flex';
        let info = state.igrejaInfo || {};
        if (!info.nome) {
          try {
            const rawCache = localStorage.getItem('gipp_portal_db_cache');
            if (rawCache) {
              const parsed = JSON.parse(rawCache);
              if (parsed.igreja) info = parsed.igreja;
            }
          } catch(e) {}
        }

        const churchName = info.nome || state.igrejaNome || 'ASSEMBLEIA DE DEUS';
        const logoUrl = info.logoUrl || info.logo || state.igrejaLogoUrl;
        const pastorName = info.pastor ? ('Pastor Presidente: ' + info.pastor) : '';
        const cityState = (info.cidade || '') + (info.cidade && info.uf ? ' • ' : '') + (info.uf || '');

        document.getElementById('logo-church-name').innerText = churchName;
        
        const logoImg = document.getElementById('logo-img');
        const logoFallback = document.getElementById('logo-fallback');
        if (logoUrl) {
          logoImg.src = logoUrl;
          logoImg.style.display = 'block';
          logoFallback.style.display = 'none';
        } else {
          logoImg.style.display = 'none';
          logoFallback.style.display = 'block';
        }

        const pastorEl = document.getElementById('logo-church-pastor');
        pastorEl.innerText = pastorName;
        pastorEl.style.display = pastorName ? 'block' : 'none';

        const cityEl = document.getElementById('logo-church-city');
        cityEl.innerText = cityState;
        cityEl.style.display = cityState ? 'block' : 'none';
      } else {
        logoOverlay.style.display = 'none';
      }

      // Tema
      document.body.className = 'theme-' + (state.tema || 'navy');

      // Slides
      const currentSlide = state.slides && state.slides[state.indiceAtual] ? state.slides[state.indiceAtual] : null;
      const titleEl = document.getElementById('slide-title');
      const textEl = document.getElementById('slide-text');
      const pillEl = document.getElementById('header-pill');
      const refEl = document.getElementById('verse-ref');
      const counterEl = document.getElementById('slide-counter');
      const churchEl = document.getElementById('church-label');

      churchEl.innerText = (state.igrejaNome || (state.igrejaInfo && state.igrejaInfo.nome) || 'ASSEMBLEIA DE DEUS') + ' • TELÃO HOLYRICS';

      if (state.limparTexto) {
        titleEl.innerText = '';
        textEl.innerText = '';
        pillEl.style.display = 'none';
        refEl.style.display = 'none';
        return;
      }

      // Mídia / Imagem em Tela Cheia sem textos sobrepostos
      const mediaOverlay = document.getElementById('media-overlay');
      const mediaImg = document.getElementById('media-img');
      const isMediaSlide = currentSlide && (currentSlide.tipo === 'midia_imagem' || currentSlide.imagemUrl);

      if (isMediaSlide && !state.blackout && !state.exibirLogo && !state.limparTexto) {
        mediaOverlay.style.display = 'flex';
        mediaImg.src = currentSlide.imagemUrl;
        const fitMode = currentSlide.ajusteImagem || state.enquadramentoImagem || 'contain';
        if (fitMode === 'cover') {
          mediaImg.style.objectFit = 'cover';
        } else if (fitMode === 'fill') {
          mediaImg.style.objectFit = 'fill';
        } else {
          mediaImg.style.objectFit = 'contain';
        }
        pillEl.style.display = 'none';
        titleEl.innerText = '';
        textEl.innerText = '';
        refEl.style.display = 'none';
      } else {
        mediaOverlay.style.display = 'none';
      }

      if (currentSlide && !isMediaSlide) {
        counterEl.innerText = 'Slide ' + (state.indiceAtual + 1) + ' / ' + state.slides.length;

        if (currentSlide.subtitulo) {
          pillEl.innerText = currentSlide.subtitulo;
          pillEl.style.display = 'inline-block';
        } else {
          pillEl.style.display = 'none';
        }

        if (currentSlide.versiculo) {
          titleEl.innerText = '';
          textEl.innerText = '"' + currentSlide.versiculo.texto + '"';
          refEl.innerText = '— ' + currentSlide.versiculo.referencia;
          refEl.style.display = 'block';
        } else {
          refEl.style.display = 'none';
          if (currentSlide.tipo === 'capa') {
            titleEl.innerText = currentSlide.titulo;
            textEl.innerText = currentSlide.texto || '';
          } else {
            titleEl.innerText = '';
            textEl.innerText = currentSlide.texto || (currentSlide.pontos ? currentSlide.pontos.join('\n• ') : currentSlide.titulo);
          }
        }
      }

      // Fundo Animado
      window.__holyricsBgType = state.fundoAnimado || 'none';

      // Alerta
      const alertBar = document.getElementById('alert-bar');
      if (state.alertaAtivo && !state.blackout) {
        alertBar.innerText = '⚠️ ' + state.alertaAtivo.texto;
        alertBar.style.display = 'block';
      } else {
        alertBar.style.display = 'none';
      }
    }

    // Motor de Fundos Animados no Canvas
    (function() {
      const canvas = document.getElementById('bg-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      let width = canvas.width = window.innerWidth;
      let height = canvas.height = window.innerHeight;
      window.addEventListener('resize', () => {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      });

      const particles = Array.from({ length: 65 }, () => ({
        x: Math.random() * width,
        y: Math.random() * height,
        size: Math.random() * 2.5 + 1,
        speedY: -(Math.random() * 0.45 + 0.15),
        speedX: (Math.random() - 0.5) * 0.25,
        alpha: Math.random() * 0.6 + 0.2,
        hue: Math.random() * 20 + 38
      }));

      let waveStep = 0;

      function animate() {
        const bgType = window.__holyricsBgType || 'none';
        ctx.clearRect(0, 0, width, height);

        if (bgType === 'particulas_douradas') {
          const g = ctx.createRadialGradient(width*0.5, height*0.4, 40, width*0.5, height*0.5, Math.max(width, height)*0.8);
          g.addColorStop(0, '#1c1503');
          g.addColorStop(1, '#030200');
          ctx.fillStyle = g;
          ctx.fillRect(0, 0, width, height);
          particles.forEach(p => {
            p.y += p.speedY;
            p.x += p.speedX;
            if (p.y < -10) { p.y = height + 10; p.x = Math.random() * width; }
            ctx.fillStyle = `hsla(${p.hue}, 95%, 65%, ${p.alpha})`;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
          });
        } else if (bgType === 'ondas_celestiais') {
          ctx.fillStyle = '#030712';
          ctx.fillRect(0, 0, width, height);
          waveStep += 0.008;
          [0.45, 0.58, 0.72].forEach((offset, i) => {
            ctx.fillStyle = i === 0 ? 'rgba(14,165,233,0.14)' : i === 1 ? 'rgba(99,102,241,0.14)' : 'rgba(45,212,191,0.12)';
            ctx.beginPath();
            ctx.moveTo(0, height);
            for (let x = 0; x <= width; x += 20) {
              ctx.lineTo(x, height * offset + Math.sin(x * 0.002 + waveStep * (i + 1)) * 75);
            }
            ctx.lineTo(width, height);
            ctx.fill();
          });
        } else if (bgType === 'feixes_luz' || bgType === 'bokeh_avivamento' || bgType === 'nebulosa_oracao' || bgType === 'fogo_pentecostal') {
          waveStep += 0.01;
          ctx.fillStyle = bgType === 'fogo_pentecostal' ? '#120401' : '#050414';
          ctx.fillRect(0, 0, width, height);
          particles.forEach((p, idx) => {
            p.y += p.speedY * (bgType === 'fogo_pentecostal' ? 1.8 : 0.8);
            if (p.y < -20) p.y = height + 20;
            const rad = bgType === 'bokeh_avivamento' ? p.size * 18 : p.size * 2;
            ctx.fillStyle = bgType === 'fogo_pentecostal' ? `rgba(249,115,22,${p.alpha})` : `rgba(139,92,246,${p.alpha * 0.45})`;
            ctx.beginPath();
            ctx.arc(p.x, p.y, rad, 0, Math.PI * 2);
            ctx.fill();
          });
        }

        requestAnimationFrame(animate);
      }
      animate();
    })();

    // Tela cheia ao duplo clique
    window.addEventListener('dblclick', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(()=>{});
      } else {
        document.exitFullscreen().catch(()=>{});
      }
    });
  </script>
</body>
</html>
